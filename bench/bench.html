<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<body>
<script src="../node_modules/hydra-synth/dist/hydra-synth.js"></script>
<script>
  const params = new URLSearchParams(location.search)
  const width = Number(params.get('w') || 1920), height = Number(params.get('h') || 1080)
  window.hydra = new Hydra({ width, height, detectAudio: false, enableStreamCapture: false, autoLoop: false })
  const gl = hydra.regl._gl
  const info = gl.getExtension('WEBGL_debug_renderer_info')
  window.renderer = info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)
  // Wraps the hydra tick to time the JS part of a frame (GL calls are queued, not waited for).
  window.tickTimes = []
  let last = performance.now()
  const loop = (now) => {
    const t0 = performance.now()
    hydra.tick(now - last)
    window.tickTimes.push(performance.now() - t0)
    last = now
    requestAnimationFrame(loop)
  }
  requestAnimationFrame(loop)
  window.measure = (seconds) => new Promise((resolve) => {
    let frames = 0, start = 0
    window.tickTimes = []
    const step = (now) => {
      if (!start) start = now
      frames++
      if (now - start < seconds * 1000) requestAnimationFrame(step)
      else {
        const sorted = window.tickTimes.slice().sort((x, y) => x - y)
        resolve({ fps: (frames - 1) / ((now - start) / 1000), jsTickMeanMs: sorted.reduce((x, y) => x + y, 0) / sorted.length })
      }
    }
    requestAnimationFrame(step)
  })
</script>
