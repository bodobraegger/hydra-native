name: build

# A manual run uploads the archive as a workflow artifact. A tag v* also attaches it to a draft release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            package: true
          # macOS and Windows build and pack the app, which the release attaches. A failure here does not stop
          # the release of Linux.
          - os: macos-15
            port: true
          - os: windows-2025
            port: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.port == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The JS bundle of the ports.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: matrix.port

      # The program, the capture tool and the patch bay helper. The patch bay test does not run here, so the
      # runner needs no ffmpeg.
      - name: Build the port
        if: matrix.port && runner.os == 'macOS'
        run: |
          brew install sdl3 ninja
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # The same on Windows, with the toolchain llvm-mingw (README.md), pinned by its hash.
      - name: Build the port on Windows
        if: matrix.port && runner.os == 'Windows'
        shell: bash
        env:
          LLVM_MINGW: llvm-mingw-20261104-ucrt-x86_64
          LLVM_MINGW_SHA256: 552191b5754c49a5a20723276a6fc56541ea1922c4c50b7b669022333fc1b40f
        run: |
          curl -fsSLo "$RUNNER_TEMP/$LLVM_MINGW.zip" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/$LLVM_MINGW.zip"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/$LLVM_MINGW.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/$LLVM_MINGW.zip" -d "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/$LLVM_MINGW/bin:$PATH"
          echo "$RUNNER_TEMP/$LLVM_MINGW/bin" >> "$GITHUB_PATH"
          ninja --version || choco install ninja --no-progress -y
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build

      # Opens a hidden window with ANGLE (Metal on macOS, Direct3D 11 on Windows) and reads a drawn pixel back.
      - name: Run the window test
        if: matrix.port
        continue-on-error: true # a failed test marks the run, but the archive is still built
        run: ctest --test-dir build -R "^window$" --verbose

      # The program on ANGLE: two outputs and a text source, read back (test/check.js), and the unit tests.
      - name: Run the program check and the unit tests
        if: matrix.port
        continue-on-error: true # a failed test marks the run, but the archive is still built
        shell: bash
        run: |
          ctest --test-dir build -R "^check$" --verbose
          cmake --build build --target unit-tests
          ctest --test-dir build -L unit --output-on-failure

      # The app in a zip, which the release attaches next to the Linux archive.
      - name: Package the macOS app
        if: matrix.port && runner.os == 'macOS'
        id: package_port
        run: echo "archive=$(HYDRA_NATIVE_BUILD=$PWD/build tools/package.sh)" >> "$GITHUB_OUTPUT"

      # The zip of the program folder, which the release attaches next to the Linux archive.
      - name: Package the Windows program
        if: matrix.port && runner.os == 'Windows'
        id: package_windows
        shell: bash
        run: |
          version=
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=$GITHUB_REF_NAME; fi
          archive=$(HYDRA_NATIVE_BUILD=$PWD/build tools/package.sh $version)
          echo "archive=$(cygpath -m "$archive")" >> "$GITHUB_OUTPUT" # upload-artifact takes no path of Git Bash

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.port
        with:
          path: ${{ steps.package_port.outputs.archive || steps.package_windows.outputs.archive }}
          archive: false
          if-no-files-found: error

      # The packages of the build in README.md, and python3 for the portal tests.
      - name: Install the build dependencies
        if: matrix.package
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libsdl3-dev libgles-dev libpulse-dev libasound2-dev \
            libgio-2.0-dev python3

      # pnpm runs on the Node.js of the runner image, in the version of packageManager in package.json; make
      # runs the install.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: matrix.package
        with:
          cache: true

      - run: make
        if: matrix.package

      - name: Run the checks without a window
        if: matrix.package
        continue-on-error: true # a failed test marks the run, but the archive is still built
        run: make test # the label 'check' of 'make check' renders in a window, and the runner has no GPU

      - name: Package
        if: matrix.package
        id: package
        run: |
          version=
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=$GITHUB_REF_NAME; fi
          archive=$(tools/package.sh $version)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.package
        with:
          path: ${{ steps.package.outputs.archive }}
          archive: false
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # Always a draft: a person writes the notes and publishes it.
      # A second run for the same tag replaces the files of the existing release instead of making a second draft.
      - name: Attach the archives to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # download-artifact unpacks the zip of the macOS app into a folder; pack it again
          for folder in dist/*/; do [ -d "$folder" ] || continue; (cd dist && zip -qry "$(basename "$folder").zip" "$(basename "$folder")" && rm -r "$(basename "$folder")"); done
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "hydra-native $GITHUB_REF_NAME" \
              --notes "Draft." dist/*
          fi
