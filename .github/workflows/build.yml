name: build

# A manual run uploads the archive as a workflow artifact. A tag v* also attaches it to a draft release.
# The section "CI review" of RELEASE.md checks each part of this file against the documentation.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The packages of the build in README.md, python3 for test/portal_test.py, and the speech samples
      # of test/audio_test.c (alsa-utils).
      - name: Install the build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libsdl3-dev libgles-dev libpulse-dev libasound2-dev \
            libgio-2.0-dev libwebrtc-audio-processing-1-3 python3 alsa-utils

      # pnpm runs on the Node.js of the runner image.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11
          cache: true
      - run: pnpm install --frozen-lockfile

      - run: make

      - name: Run the checks without a window
        run: |
          make test
          echo "Skipped: the ctest label 'check' of 'make check' (check.js, fetch, gallery, patch_bay)."
          echo "These tests render in a hidden window. They need an OpenGL ES context, and the runner has no GPU."
          echo "Run 'make check' on a machine with a GPU before a release."

      - name: Package
        id: package
        run: |
          version=
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=$GITHUB_REF_NAME; fi
          archive=$(tools/package.sh $version)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.archive }}
          archive: false
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # Always a draft: a person copies the notes from RELEASE.md and publishes it.
      # A second run for the same tag replaces the files of the existing release instead of making a second draft.
      - name: Attach the archives to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "hydra-native $GITHUB_REF_NAME" \
              --notes "Draft. Copy the release notes from RELEASE.md before publishing." dist/*.tar.gz
          fi
